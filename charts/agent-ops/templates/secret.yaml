{{- if or .Values.secrets.openaiApiKey .Values.secrets.azureOpenAiApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-ops-runtime-provider-keys
  labels:
    app.kubernetes.io/name: agent-ops-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
{{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
{{- end }}
{{- if .Values.secrets.azureOpenAiApiKey }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenAiApiKey | quote }}
{{- end }}
{{- end }}

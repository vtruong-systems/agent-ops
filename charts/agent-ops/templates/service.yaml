apiVersion: v1
kind: Service
metadata:
  name: agent-ops-runtime
  labels:
    app.kubernetes.io/name: agent-ops-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-ops-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
